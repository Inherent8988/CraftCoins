
<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CraftCoins Tap</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="container">
    <h1>CraftCoins Tap</h1>

    <div class="balance">
      <div class="coin-box">
        <h2>Craft</h2>
        <p id="craft">0</p>
      </div>

      <div class="coin-box">
        <h2>CraftCoins</h2>
        <p id="coins">0</p>
      </div>
    </div>

    <div class="tap-section">
      <button id="tapButton">TAP</button>
      <p>Тапов: <span id="totalTaps">0</span></p>
      <p>До следующего Craft: <span id="progress">250</span></p>
    </div>

    <section class="shop">
      <h2>Магазин</h2>

      <div class="shop-item">
        <h3>1 CraftCoins</h3>
        <p>Цена: 150 Craft</p>
        <button id="buyButton">Купить</button>
      </div>

      <p>Куплено: <span id="purchased">0</span></p>
      <p id="shopMessage"></p>
    </section>
  </div>

  <script src="script.js"></script>
</body>
</html>
